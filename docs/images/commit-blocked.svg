<text x="70" y="17" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f85149">SentinelCommit - commit blocked</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="20.0" y="34" fill="#7ee787" xml:space="preserve">$ </text>
<text x="36.8" y="34" fill="#c9d1d9" xml:space="preserve">cp examples/transaction_fault_unsafe.py payment_service.py</text>
<text x="20.0" y="54" fill="#7ee787" xml:space="preserve">$ </text>
<text x="36.8" y="54" fill="#c9d1d9" xml:space="preserve">git add payment_service.py</text>
<text x="20.0" y="74" fill="#7ee787" xml:space="preserve">$ </text>
<text x="36.8" y="74" fill="#c9d1d9" xml:space="preserve">git commit -m &quot;Add payment deduction logic&quot;</text>
<text x="20.0" y="114" fill="#39c5cf" font-weight="bold" xml:space="preserve">[SentinelCommit] Auditing 1 staged file(s) via Claude (claude-opus-5)...</text>
<text x="20.0" y="154" fill="#f85149" font-weight="bold" xml:space="preserve">====================================================================</text>
<text x="20.0" y="174" fill="#f85149" font-weight="bold" xml:space="preserve">  [COMMIT REJECTED]   Hazard: TRANSACTION_FAULT   Severity: CRITICAL</text>
<text x="20.0" y="194" fill="#f85149" font-weight="bold" xml:space="preserve">====================================================================</text>
<text x="20.0" y="234" fill="#8b949e" xml:space="preserve">  File: </text>
<text x="87.2" y="234" fill="#39c5cf" font-weight="bold" xml:space="preserve">payment_service.py</text>
<text x="20.0" y="274" fill="#d29922" font-weight="bold" xml:space="preserve">  Why this is unsafe</text>
<text x="20.0" y="294" fill="#c9d1d9" xml:space="preserve">    The balance is debited and committed before the payment gateway</text>
<text x="20.0" y="314" fill="#c9d1d9" xml:space="preserve">    is called. If the gateway raises or times out, the debit is</text>
<text x="20.0" y="334" fill="#c9d1d9" xml:space="preserve">    already durable and no compensating action runs, so the customer</text>
<text x="20.0" y="354" fill="#c9d1d9" xml:space="preserve">    is debited for an order that was never placed.</text>
<text x="20.0" y="394" fill="#3fb950" font-weight="bold" xml:space="preserve">  Suggested remediation</text>
<text x="20.0" y="414" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="414" fill="#c9d1d9" xml:space="preserve">try:</text>
<text x="20.0" y="434" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="434" fill="#c9d1d9" xml:space="preserve">    with db.transaction():</text>
<text x="20.0" y="454" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="454" fill="#c9d1d9" xml:space="preserve">        db.execute(</text>
<text x="20.0" y="474" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="474" fill="#c9d1d9" xml:space="preserve">            &quot;UPDATE users SET balance = balance - %s &quot;</text>
<text x="20.0" y="494" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="494" fill="#c9d1d9" xml:space="preserve">            &quot;WHERE id = %s AND balance &gt;= %s&quot;,</text>
<text x="20.0" y="514" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="514" fill="#c9d1d9" xml:space="preserve">            (amount, user_id, amount),</text>
<text x="20.0" y="534" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="534" fill="#c9d1d9" xml:space="preserve">        )</text>
<text x="20.0" y="554" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="554" fill="#c9d1d9" xml:space="preserve">        payment_gateway.charge(user_id, amount)</text>
<text x="20.0" y="574" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="574" fill="#c9d1d9" xml:space="preserve">except PaymentError:</text>
<text x="20.0" y="594" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="594" fill="#c9d1d9" xml:space="preserve">    db.rollback()</text>
<text x="20.0" y="614" fill="#8b949e" xml:space="preserve">    | </text>
<text x="70.4" y="614" fill="#c9d1d9" xml:space="preserve">    raise</text>
<text x="20.0" y="654" fill="#8b949e" xml:space="preserve">  Fix and re-stage, or bypass with: git commit --no-verify</text>
<text x="20.0" y="674" fill="#f85149" font-weight="bold" xml:space="preserve">====================================================================</text>
<text x="20.0" y="714" fill="#7ee787" xml:space="preserve">$ </text>
<text x="36.8" y="714" fill="#c9d1d9" xml:space="preserve">git log --oneline -1</text>
<text x="20.0" y="734" fill="#c9d1d9" xml:space="preserve">710d81e docs: touch examples readme</text>
<text x="314.0" y="734" fill="#8b949e" xml:space="preserve">   &lt;- no commit was created</text>
</g></svg>
